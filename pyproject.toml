[tool.ruff]
target-version = "py312"
line-length = 110
extend-include = ["*.pyw"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# zip() sempre recebe sequências do mesmo tamanho aqui; strict= só adicionaria ruído.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Variáveis de ambiente e o log precisam ser configurados antes dos imports pesados.
"app.pyw" = ["E402"]
